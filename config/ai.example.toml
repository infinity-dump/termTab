[inline]
enabled = true
accept_keys = ["right"]
debounce_ms = 120

[output_capture]
# When true, the plugin re-execs the interactive shell under a script(1)-style
# pty recorder (pty_record.py, which also forwards window resizes) so the
# session typescript can be parsed for the last command's stdout/stderr. The
# helper uses that context to suggest corrections when the user mistypes a
# command and starts retyping. Set to false to keep the shell vanilla.
enabled = true

[history]
enabled = true
session_enabled = true
session_max_entries = 200
direct_match_min_chars = 3
max_entries = 8000
max_bytes = 2097152
top_matches = 8
max_suggestion_chars = 320
recency_weight = 100
frequency_weight = 8

[provider]
name = "openrouter"
model = "mistralai/codestral-2508"
base_url = "https://openrouter.ai/api/v1"
sort = "latency"
max_tokens = 24
